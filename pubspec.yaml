name: sovchilar
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.1+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0
  #localization
  easy_localization: ^3.0.3
  #bloc
  flutter_bloc: ^8.1.3
  #get it
  get_it: ^7.7.0
  shared_preferences: ^2.2.1
  #dio
  dio: ^5.3.3
  equatable: ^2.0.5
  flutter_svg: ^2.0.7
  local_auth: ^2.1.7
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  build_runner: ^2.4.14
  path_provider: ^2.1.1
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  http_parser: ^4.1.2
  flutter_launcher_icons: ^0.14.3
  socket_io_client: ^3.0.2
  provider: ^6.1.2
  rxdart: ^0.28.0
  liquid_glass_widgets: ^1.5.0
  another_flushbar: ^2.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/img_logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/locale/

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/static/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/static/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/static/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/static/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/static/Inter-Black.ttf
          weight: 900

    - family: unbounded
      fonts:
        - asset: assets/fonts/Unbounded/static/Unbounded-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Unbounded/static/Unbounded-Light.ttf
          weight: 300
        - asset: assets/fonts/Unbounded/static/Unbounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/Unbounded/static/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded/static/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded/static/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded/static/Unbounded-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Unbounded/static/Unbounded-Black.ttf
          weight: 900
